<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMP·REC 미니 위젯</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Pretendard',sans-serif; background:transparent; }
  #jwMini { max-width:none; margin:0 auto; padding:32px 28px; background:#E4EBF7; border-radius:24px; }
  .jw-mini-inner { max-width:1100px; margin:0 auto; }
  .jw-mini-head { text-align:center; margin-bottom:32px; }
  .jw-mini-eyebrow { font-size:15px; font-weight:800; color:#34B686; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px; }
  .jw-mini-title { font-size:36px; font-weight:900; color:#132E80; margin-bottom:10px; }
  .jw-mini-date { font-size:16px; color:#9CA3AF; font-weight:600; }
  .jw-mini-row { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  .jw-mini-card { background:#fff; border:1px solid #E5E7EB; border-radius:18px; padding:28px 30px; box-shadow:0 4px 16px rgba(19,46,128,0.06); }
  .jw-mini-label { font-size:20px; font-weight:700; color:#6B7280; margin-bottom:14px; }
  .jw-mini-value { font-size:52px; font-weight:800; color:#132E80; }
  .jw-mini-unit { font-size:20px; font-weight:500; color:#9CA3AF; margin-left:4px; }
  .jw-mini-delta { font-size:17px; font-weight:700; color:#B94A1F; margin-top:12px; }
  .jw-mini-highlight { background:#EAF9F1; border:1px solid #34B686; }
  .jw-mini-highlight .jw-mini-label { color:#0F6E56; }
  .jw-mini-highlight .jw-mini-value { color:#0F6E56; }
  .jw-mini-more { text-align:right; margin-top:22px; }
  .jw-mini-more a { font-size:17px; font-weight:700; color:#34B686; text-decoration:none; }
  .jw-mini-more a:hover { text-decoration:underline; }
  @media (max-width:640px) {
    .jw-mini-row { grid-template-columns:1fr; }
    .jw-mini-value { font-size:44px; }
  }
</style>
</head>
<body>
<div id="jwMini">
  <div class="jw-mini-inner">
  <div class="jw-mini-head">
    <div class="jw-mini-eyebrow">SMP · REC</div>
    <div class="jw-mini-title">실시간 시장 현황</div>
    <div class="jw-mini-date" id="jwMiniDate">-</div>
  </div>
  <div class="jw-mini-row">
    <div class="jw-mini-card">
      <div class="jw-mini-label">SMP</div>
      <div class="jw-mini-value"><span id="jwMiniSmp">-</span><span class="jw-mini-unit">원/kWh</span></div>
      <div class="jw-mini-delta" id="jwMiniSmpDelta"></div>
    </div>
    <div class="jw-mini-card">
      <div class="jw-mini-label">REC</div>
      <div class="jw-mini-value"><span id="jwMiniRec">-</span><span class="jw-mini-unit">원/REC</span></div>
      <div class="jw-mini-delta" id="jwMiniRecDelta"></div>
    </div>
    <div class="jw-mini-card jw-mini-highlight">
      <div class="jw-mini-label">1kW당 예상 수익</div>
      <div class="jw-mini-value"><span id="jwMiniPlus">-</span><span class="jw-mini-unit">원/kWh</span></div>
      <div class="jw-mini-delta" style="color:#0F6E56;">REC 가중치 1.2 반영</div>
    </div>
  </div>
  <div class="jw-mini-more"><a href="https://onerec.kmos.kr/portal/index.do" target="_blank" rel="noopener">추이 및 상세 보기 →</a></div>
  </div>
</div>
<script>
fetch('https://raw.githubusercontent.com/joowonenergy/joowon-smp-rec-data/main/data/smp-rec.json')
  .then(function(res){ return res.json(); })
  .then(function(records){
    if (!records || records.length === 0) return;
    var today = records[0];
    var yesterday = records[1] || today;
    function getSmp(r){ return Number(r.smp !== undefined && r.smp !== null ? r.smp : r.smp_land) || 0; }
    var smpToday = getSmp(today);
    var smpYesterday = getSmp(yesterday);
    var recToday = Number(today.rec) || 0;
    var recYesterday = Number(yesterday.rec) || 0;
    var smpDelta = smpToday - smpYesterday;
    var recDelta = recToday - recYesterday;
    var smpPlus = smpToday + (recToday * 1.2) / 1000;
    document.getElementById('jwMiniDate').textContent = today.date + ' 기준';
    document.getElementById('jwMiniSmp').textContent = smpToday.toFixed(2);
    document.getElementById('jwMiniSmpDelta').innerHTML = (smpDelta >= 0 ? '▲ ' : '▼ ') + Math.abs(smpDelta).toFixed(2) + ' (전일대비)';
    document.getElementById('jwMiniRec').textContent = recToday.toLocaleString();
    document.getElementById('jwMiniRecDelta').innerHTML = (recDelta >= 0 ? '▲ ' : '▼ ') + Math.abs(recDelta).toLocaleString() + ' (전일대비)';
    document.getElementById('jwMiniPlus').textContent = smpPlus.toFixed(2);
  })
  .catch(function(err){ console.error('SMP/REC 데이터 로드 실패:', err); });
</script>
</body>
</html>
