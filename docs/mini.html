<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMP·REC 미니 위젯</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:'Pretendard',sans-serif; background:transparent; }
#jwMini { max-width:none; margin:0 auto; padding:36px 28px; background:transparent; }
.jw-mini-inner { max-width:1100px; margin:0 auto; background:#fff; border:1px solid #EAEBEF; border-radius:20px;
  box-shadow:0 4px 20px rgba(19,46,128,0.05); padding:44px 48px; }
.jw-mini-head { text-align:center; margin-bottom:32px; }
.jw-mini-accent-bar { width:48px; height:4px; background:#34B686; border-radius:2px; margin:0 auto 18px; }
.jw-mini-eyebrow { font-size:16px; font-weight:700; color:#6B7280; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:10px; }
.jw-mini-title { font-size:34px; font-weight:800; color:#132E80; }
.jw-mini-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1px solid #EEF0F3;
  border-bottom:1px solid #EEF0F3; padding:28px 0; margin-bottom:30px; }
.jw-mini-stat { text-align:left; padding:0 28px; border-left:1px solid #EEF0F3; }
.jw-mini-stat:first-child { border-left:none; padding-left:0; }
.jw-mini-stat-label { font-size:16px; font-weight:600; color:#9CA3AF; letter-spacing:0.01em; margin-bottom:6px; }
.jw-mini-stat-date { font-size:14px; color:#C1C5CC; font-weight:500; margin-bottom:12px; }
.jw-mini-stat-value { font-size:38px; font-weight:700; color:#1F2937; }
.jw-mini-stat-unit { font-size:17px; font-weight:500; color:#9CA3AF; margin-left:4px; }
.jw-mini-stat-delta { font-size:16px; font-weight:600; color:#B45309; margin-left:10px; }
.jw-mini-note { font-size:14px; font-weight:500; color:#B0B4BB; margin-top:8px; }
.jw-mini-legend { display:flex; gap:22px; margin-bottom:16px; font-size:15px; font-weight:600; color:#9CA3AF; }
.jw-mini-legend span { display:flex; align-items:center; gap:8px; }
.jw-dot-navy { width:10px; height:10px; border-radius:50%; background:#132E80; }
.jw-dot-green { width:10px; height:10px; border-radius:50%; background:#34B686; }
.jw-mini-chart-box { position:relative; height:240px; }
.jw-mini-more { text-align:right; margin-top:20px; }
.jw-mini-more a { font-size:16px; font-weight:600; color:#6B7280; text-decoration:none; }
.jw-mini-more a:hover { color:#34B686; }
@media (max-width:640px) {
  .jw-mini-stats { grid-template-columns:1fr; gap:20px; }
  .jw-mini-stat { border-left:none; padding-left:0; border-top:1px solid #EEF0F3; padding-top:18px; }
  .jw-mini-stat:first-child { border-top:none; padding-top:0; }
  .jw-mini-stat-value { font-size:32px; }
}
</style>
</head>
<body>
<div id="jwMini">
<div class="jw-mini-inner">
  <div class="jw-mini-head">
    <div class="jw-mini-accent-bar"></div>
    <div class="jw-mini-eyebrow">SMP · REC</div>
    <div class="jw-mini-title">실시간 시장 현황</div>
  </div>

  <div class="jw-mini-stats">
    <div class="jw-mini-stat">
      <div class="jw-mini-stat-label">SMP</div>
      <div class="jw-mini-stat-date" id="jwMiniSmpDate">-</div>
      <div><span class="jw-mini-stat-value" id="jwMiniSmp">-</span><span class="jw-mini-stat-unit">원/kWh</span><span class="jw-mini-stat-delta" id="jwMiniSmpDelta"></span></div>
    </div>
    <div class="jw-mini-stat">
      <div class="jw-mini-stat-label">REC 현물</div>
      <div class="jw-mini-stat-date" id="jwMiniRecDate">-</div>
      <div><span class="jw-mini-stat-value" id="jwMiniRec">-</span><span class="jw-mini-stat-unit">원/REC</span></div>
      <div class="jw-mini-note">화·목요일에만 고시가가 갱신돼요</div>
    </div>
    <div class="jw-mini-stat">
      <div class="jw-mini-stat-label">SMP + (REC × 1.2)</div>
      <div class="jw-mini-stat-date">1kW당 예상 수익</div>
      <div><span class="jw-mini-stat-value" id="jwMiniPlus">-</span><span class="jw-mini-stat-unit">원/kWh</span></div>
    </div>
  </div>

  <div class="jw-mini-legend">
    <span><span class="jw-dot-navy"></span>SMP</span>
    <span><span class="jw-dot-green"></span>REC (환산 반영)</span>
  </div>
  <div class="jw-mini-chart-box">
    <canvas id="jwMiniChart" role="img" aria-label="최근 30일 SMP, REC 추이 미니 차트"></canvas>
  </div>

  <div class="jw-mini-more"><a href="https://onerec.kmos.kr/portal/index.do" target="_blank" rel="noopener">추이 및 상세 보기 →</a></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
fetch('https://raw.githubusercontent.com/joowonenergy/joowon-smp-rec-data/main/data/smp-rec.json')
.then(function(res){ return res.json(); })
.then(function(records){
  if (!records || records.length === 0) return;
  var today = records[0];
  var yesterday = records[1] || today;
  function getSmp(r){ return Number(r.smp !== undefined && r.smp !== null ? r.smp : r.smp_land) || 0; }

  var smpToday = getSmp(today);
  var smpYesterday = getSmp(yesterday);
  var recToday = Number(today.rec) || 0;
  var smpDelta = smpToday - smpYesterday;
  var smpPlus = smpToday + (recToday * 1.2) / 1000;

  document.getElementById('jwMiniSmpDate').textContent = today.date;
  document.getElementById('jwMiniSmp').textContent = smpToday.toFixed(2);
  document.getElementById('jwMiniSmpDelta').innerHTML = (smpDelta >= 0 ? '▲' : '▼') + Math.abs(smpDelta).toFixed(2);
  document.getElementById('jwMiniRecDate').textContent = today.date;
  document.getElementById('jwMiniRec').textContent = recToday.toLocaleString();
  document.getElementById('jwMiniPlus').textContent = smpPlus.toFixed(2);

  var trend = records.slice(0, 30).slice().reverse();
  var labels = trend.map(function(r){ return r.date.slice(5); });
  var smpSeries = trend.map(getSmp);
  var recSeries = trend.map(function(r){ return (Number(r.rec) || 0) * 1.2 / 1000; });

  new Chart(document.getElementById('jwMiniChart'), {
    type: 'line',
    data: { labels: labels, datasets: [
      { label:'SMP', data: smpSeries, borderColor:'#132E80', backgroundColor:'rgba(19,46,128,0.06)', borderWidth:2.5, pointRadius:0, fill:true, tension:0.3 },
      { label:'REC(환산)', data: recSeries, borderColor:'#34B686', backgroundColor:'rgba(52,182,134,0.08)', borderWidth:2.5, pointRadius:0, fill:true, tension:0 }
    ]},
    options: {
      responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{ legend:{ display:false } },
      scales:{
        x:{ ticks:{ maxTicksLimit:6, color:'#9CA3AF', font:{size:13} }, grid:{ display:false } },
        y:{ ticks:{ color:'#9CA3AF', font:{size:13} }, grid:{ color:'#F1F1F1' } }
      }
    }
  });
})
.catch(function(err){ console.error('SMP/REC 데이터 로드 실패:', err); });
</script>
</body>
</html>
