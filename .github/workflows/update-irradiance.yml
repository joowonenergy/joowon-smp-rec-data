name: Update Daily Irradiance

on:
  schedule:
    - cron: '10 22 * * *'  # 매일 한국시간(KST) 오전 7시 10분
  workflow_dispatch:
    inputs:
      probe:
        description: '형식 점검만 하기 (1시간치만 받아 로그에 출력, 파일 저장 안 함)'
        type: boolean
        default: false
      date:
        description: '특정 날짜로 갱신 (YYYY-MM-DD, 비우면 어제)'
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install requests numpy shapely pyproj

      - name: 일사량 형식 점검 (probe)
        if: ${{ inputs.probe }}
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: python automation/fetch_irradiance.py --probe ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: 어제 일사량 수집 및 시·군·구별 정리
        if: ${{ !inputs.probe }}
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: python automation/fetch_irradiance.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: 변경사항 커밋 및 푸시
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-irradiance.json data/daily-history.json
          git diff --quiet --cached || git commit -m "chore: 일사량 자동 갱신 $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
