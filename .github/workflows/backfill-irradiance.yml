name: Backfill Irradiance Baseline

on:
  workflow_dispatch:
    inputs:
      start:
        description: '시작 날짜 (YYYY-MM-DD)'
        required: true
        default: '2024-10-01'
      end:
        description: '끝 날짜 (YYYY-MM-DD)'
        required: true
        default: '2024-10-07'
      step:
        description: '며칠 간격으로 받을지 (1=매일, 5=5일마다)'
        required: true
        default: '1'
      workers:
        description: '동시에 받는 개수'
        required: true
        default: '4'
      max_minutes:
        description: '최대 실행 시간(분) - 넘으면 저장하고 멈춤'
        required: true
        default: '300'

permissions:
  contents: write

concurrency:
  group: backfill-irradiance
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install requests numpy shapely pyproj

      - name: 과거 일사량 표본 수집
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: python automation/backfill_irradiance.py --start "${{ inputs.start }}" --end "${{ inputs.end }}" --step "${{ inputs.step }}" --workers "${{ inputs.workers }}" --max-minutes "${{ inputs.max_minutes }}"

      - name: 새 평년 후보 계산
        run: python automation/aggregate_clim_2a.py

      - name: 변경사항 커밋 및 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backfill-2a.json data/irr_clim_2a.json || true
          git diff --quiet --cached || git commit -m "chore: 과거 일사량 표본 수집 ${{ inputs.start }}~${{ inputs.end }}"
          git pull --rebase origin main
          git push
